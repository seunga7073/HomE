<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>서승아 | Portfolio</title>
<style>
  :root {
    --mint: #d5f2e3;
    --mint-2: #c3ecd6;
    --lime: #dff0c7;
    --text: #2f3b34;
    --text-muted: #5f6f65;
    --card: #ffffff;
    --border: #e3ede5;
    --accent: #7bb894;
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard",
      "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(180deg, #f3fbf6 0%, var(--mint) 50%, var(--lime) 100%);
    color: var(--text);
    line-height: 1.6;
  }

  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Hero */
  .hero {
    position: relative;
    min-height: 78vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    text-align: center;
    padding: 60px 24px 72px;
    background-image:
      linear-gradient(180deg, rgba(213, 242, 227, 0.25) 0%, rgba(195, 236, 214, 0.55) 55%, rgba(223, 240, 199, 0.92) 100%),
      url('player.jpg');
    background-size: cover;
    background-position: center 20%;
  }

  .hero h1 {
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
    text-shadow: 0 2px 16px rgba(255, 255, 255, 0.6);
  }

  .hero p.tagline {
    margin-top: 12px;
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    color: var(--text);
    text-shadow: 0 2px 12px rgba(255, 255, 255, 0.6);
  }

  /* Section titles */
  section {
    padding: 60px 0;
  }

  .section-title {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
    text-align: center;
  }

  /* Interests */
  .pill-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
  }

  .pill {
    padding: 12px 26px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    box-shadow: 0 6px 16px rgba(123, 184, 148, 0.12);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .pill:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(123, 184, 148, 0.2);
  }

  /* Contact */
  .contact {
    text-align: center;
    padding-bottom: 80px;
  }

  .contact-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    margin-top: 8px;
  }

  .contact-link {
    padding: 14px 28px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    box-shadow: 0 6px 16px rgba(123, 184, 148, 0.12);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .contact-link:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(123, 184, 148, 0.2);
  }

  footer {
    text-align: center;
    padding: 28px 24px 40px;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  @media (max-width: 640px) {
    .hero {
      min-height: 60vh;
      background-position: center 15%;
    }
    section {
      padding: 44px 0;
    }
  }
</style>
</head>
<body>

  <header class="hero">
    <h1>서승아</h1>
    <p class="tagline">안녕하세요</p>
  </header>

  <section id="interests">
    <div class="container">
      <p class="section-title">Interests</p>
      <div class="pill-row">
        <span class="pill">야구</span>
        <span class="pill">베이킹</span>
        <span class="pill">베이스</span>
      </div>
    </div>
  </section>

  <section id="contact" class="contact">
    <div class="container">
      <p class="section-title">Contact</p>
      <div class="contact-links">
        <a class="contact-link" href="mailto:seunga7073@gmail.com">✉️ seunga7073@gmail.com</a>
        <a class="contact-link" href="https://github.com/seunga7073" target="_blank" rel="noopener noreferrer">🐙 GitHub: seunga7073</a>
      </div>
    </div>
  </section>

  <footer>
    &copy; 2026 서승아
  </footer>

</body>
</html>
